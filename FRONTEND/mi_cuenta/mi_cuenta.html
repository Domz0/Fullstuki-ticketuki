<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />

  <body class="pagina_cuenta">
    <div id="header"></div>
    <main class="cuenta">

          </div>

        <div class="separador"></div>
        <div class="enlaces">
          <a href="historial.html">Mis tickets</a>

        </div>
      </div>

      <div class="datos_usuario">
        <h2>Datos del Usuario/a</h2>
        <div class="cuenta_fila">
          <fieldset class="campo_cuenta">
            <legend>Nombre</legend>
            Camila
          </fieldset>
          <fieldset class="campo_cuenta">
            <legend>Apellido</legend>
            Vergara

        </div>
        <div class="cuenta_fila">
          <fieldset class="campo_cuenta">
            <legend>Run</legend>
            12345678-9
          </fieldset>
          <fieldset class="campo_cuenta">
            <legend>Fecha de Nacimiento</legend>
            01/04/1998
          </fieldset>
        </div>
        <div class="cuenta_fila">
          <fieldset class="campo_cuenta">
            <legend>Correo electronico</legend>
            correo@correo.cl
          </fieldset>
          <fieldset class="campo_cuenta">
            <legend>Numero de contacto</legend>
            +56912345678
