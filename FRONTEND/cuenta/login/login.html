<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="flex-container">
      <section class="form-container">
        <a class="ticketuki" href="../../index.html"> Ticketuki</a>
        <div class="form">
          <form id="formulario_login">
            <h2>Ingresar a tu cuenta</h2>
            <div class="input-container">
              <label for="email">Correo electrónico</label>
              <input
                type="text"
                id="email"
                name="email"
                placeholder="tu@ejemplo.com"
              />
              <p id="mensaje_email" class="mensaje_validacion"></p>
            </div>
            <div class="input-container">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
              />
              <p id="mensaje_password" class="mensaje_validacion"></p>
            </div>
            <a href="" class="olvidar">¿Olvidaste tu contraseña?</a>

            <button type="submit">Iniciar sesión</button>

            <p class="crear">
              ¿No tienes cuenta?
              <a href="../crear-cuenta/crear-cuenta.html"> Crear cuenta</a>
            </p>
          </form>
        </div>
      </section>

      <section class="img-container">
        <img
          src="https://images.unsplash.com/photo-1429962714451-bb934ecdc4ec?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8Y29uY2llcnRvfGVufDB8fDB8fHww"
          alt=""
        />
      </section>
    </div>
    <script src="login.js"></script>
  </body>
</html>
