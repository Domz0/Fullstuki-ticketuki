<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="mi-cuenta.css" />
    <link rel="stylesheet" href="../../componentes/header/header.css" />
    <link rel="stylesheet" href="../../componentes/footer/footer.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap"
    />
  </head>
  <body class="pagina pagina_cuenta" data-pagina="cuenta" data-sesion="cliente">
    <div id="header"></div>
    <main class="flex_H cuenta">
      <div class="flex_V panel menu_izq">
        <div class="flex_V cuenta_usuario">
          <div class="flex_H cuenta_usuario_fila">
            <div
              id="iniciales"
              class="flex_centrado texto_secundario imagen"
            ></div>
            <h1 id="nombre_completo"></h1>
          </div>
          <p class="texto_small">Miembro desde 2023</p>
        </div>
        <div class="separador"></div>
        <div class="flex_V enlaces">
          <a class="enlace" href="../mis-entradas/mis-entradas.html"
            >Mis entradas</a
          >
          <a class="enlace" href="../historial/historial.html">
            <!-- pauli, regulariza la ubicacion depsues-->
            Historial de pago
          </a>
          <a id="cerrar_sesion" class="enlace" href="../../index.html">
            Cerrar sesión
          </a>
        </div>
      </div>

      <div class="flex_V panel datos_usuario">
        <h2>Datos del Usuario/a</h2>
        <div class="flex_H cuenta_fila">
          <fieldset class="fieldset_base campo_cuenta">
            <legend class="texto_small">Nombre</legend>
            <span id="nombre"></span>
          </fieldset>
          <fieldset class="fieldset_base campo_cuenta">
            <legend class="texto_small">Apellido</legend>
            <span id="apellido"></span>
          </fieldset>
        </div>
        <div class="flex_H cuenta_fila">
          <fieldset class="fieldset_base campo_cuenta">
            <legend class="texto_small">Run</legend>
            <span id="rut"></span>
          </fieldset>
        </div>
        <div class="flex_H cuenta_fila">
          <fieldset class="fieldset_base campo_cuenta">
            <legend class="texto_small">Correo electronico</legend>
            <span id="correo"></span>
          </fieldset>
        </div>

        <button type="button" id="editar_datos">Editar datos de acceso</button>

        <div id="form_editar" class="form_editar">
          <div class="input_editar">
            <label for="nuevo_correo">Nuevo correo</label>
            <input type="text" id="nuevo_correo" />
            <p id="mensaje_correo" class="mensaje_validacion"></p>
          </div>

          <div class="input_editar">
            <label for="nueva_password">Nueva contraseña</label>
            <input type="password" id="nueva_password" />
            <p id="mensaje_password" class="mensaje_validacion"></p>
          </div>

          <div class="botones_editar">
            <button type="button" id="guardar_datos">Guardar cambios</button>

            <button type="button" id="cancelar_edicion">Cancelar</button>
          </div>
        </div>

        <!-- <fieldset class="fieldset_base campo_cuenta">
            <legend class="texto_small">Fecha de Nacimiento</legend>
            <span id="fecha_nacimiento">BORRAR? Fecha de Nacimiento</span>
          </fieldset> -->

        <!-- <fieldset class="fieldset_base campo_cuenta">
            <legend class="texto_small">Numero de contacto</legend>
            <span id="telefono">BORRAR? num de telefono</span>
          </fieldset> -->
      </div>
    </main>
    <div id="footer"></div>
    <script src="../../componentes/header/header.js"></script>
    <script src="../../componentes/footer/footer.js"></script>
    <script src="mi-cuenta.js"></script>
  </body>
</html>
