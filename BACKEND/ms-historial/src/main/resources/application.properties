spring.application.name=ms-historial
server.port=8010

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/historial_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.com.ticketuki.historialservice=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

ms.usuario.url=${MS_USUARIO_URL:http://localhost:8001}

# Actuator: health checks (/actuator/health, /actuator/info)
management.endpoints.web.exposure.include=health,info
