spring.application.name=ms-evento
server.port=8003

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/evento_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.com.ticketuki=INFO
ms.recinto.url=${MS_RECINTO_URL:http://localhost:8008}

# Actuator: health checks (/actuator/health, /actuator/info)
management.endpoints.web.exposure.include=health,info

audit.enabled=true
